name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Install ffmpeg (extraction tests)
        # The apt step hung then failed on 2026-11-11 (runs 43040767542,
        # 43043851394, 43059834750, 43061272623): a slow mirror can stall
        # apt-get update for ~1h and fail the whole run. Retry the install
        # up to 3 times and bound each attempt so a stuck mirror fails
        # fast instead of burning the run.
        timeout-minutes: 15
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update -qq \
              && timeout 240 sudo apt-get install -y -qq --fix-missing ffmpeg; then
              exit 0
            fi
            echo "ffmpeg install attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "ffmpeg install failed after 3 attempts" >&2
          exit 1
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: pytest -q
      - run: python examples/demo.py
      - run: python examples/demo_batch.py
      - run: python examples/demo_multispeaker.py
      - run: python examples/demo_bed.py
      - run: python examples/demo_diarize.py
      - run: python examples/demo_enhance.py
      - run: python examples/demo_fidelity.py
      - run: python examples/demo_config.py
      - run: python examples/demo_report.py
      - run: python examples/demo_subtitles.py
      - run: python examples/demo_patch.py
      - run: python examples/demo_watch.py
      - run: python examples/demo_multilang.py
      - run: python examples/demo_preflight.py
      - run: python examples/demo_compare.py
      - run: python examples/demo_cache.py
      - run: python examples/demo_render.py
      - run: python examples/demo_estimate.py
      - run: python examples/demo_split.py
      - run: python examples/demo_export.py
      - run: python examples/demo_ass.py
      - run: python examples/demo_merge.py
      - run: python examples/demo_doctor.py
      - run: python examples/demo_level.py
