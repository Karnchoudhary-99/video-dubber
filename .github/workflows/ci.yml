name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Install ffmpeg (extraction tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: pytest -q
      - run: python examples/demo.py
      - run: python examples/demo_batch.py
      - run: python examples/demo_multispeaker.py
      - run: python examples/demo_bed.py
      - run: python examples/demo_diarize.py
      - run: python examples/demo_enhance.py
      - run: python examples/demo_fidelity.py
      - run: python examples/demo_config.py
      - run: python examples/demo_report.py
      - run: python examples/demo_subtitles.py
      - run: python examples/demo_patch.py
      - run: python examples/demo_watch.py
      - run: python examples/demo_multilang.py
      - run: python examples/demo_preflight.py
      - run: python examples/demo_compare.py
      - run: python examples/demo_cache.py
      - run: python examples/demo_render.py
      - run: python examples/demo_estimate.py
      - run: python examples/demo_split.py
      - run: python examples/demo_export.py
      - run: python examples/demo_ass.py
